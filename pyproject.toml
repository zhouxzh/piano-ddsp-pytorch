[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsp-piano-pytorch"
version = "1.0.0"
description = "Training and ONNX validation for causal DDSP piano control models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "zhouxzh"}]
dependencies = [
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchcodec==0.10.0",
  "mido==1.3.3",
  "numpy==1.26.4",
  "tqdm==4.66.3",
  "onnx==1.14.1",
  "onnxruntime==1.15.1",
  "aiohttp==3.13.3",
]

[tool.setuptools.packages.find]
include = ["ddsp_piano*"]

[tool.setuptools.package-data]
ddsp_piano = ["model-suite-v1.0.0.json"]
